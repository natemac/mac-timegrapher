<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MAC Bespoke Timegrapher</title>
    <meta name="description" content="A browser-based timegrapher for mechanical watches. Measures rate, amplitude and beat error from any audio input.">
      <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <!-- The light palette, which is what System resolves to on most
         devices. App.tsx corrects it to match the theme once React runs; this
         is what paints before that. -->
    <meta name="theme-color" content="#eeeae0">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- "default" is dark status-bar text, which is what a cream page needs.
         black-translucent gives white text and was right only while the app was
         dark-only. env(safe-area-inset-top) reports 0 under this style, so the
         header padding falls back to its 16px minimum rather than doubling. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Timegrapher">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
